name: Archive

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

permissions:
  contents: read

jobs:
  archive:
    name: Unsigned archive and IPA (${{ matrix.version_source }}, Xcode 26.6)
    runs-on: macos-26
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        version_source: [project, next-tag]
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'
      - name: Read project version
        env:
          VERSION_SOURCE: ${{ matrix.version_source }}
        run: |
          xcodebuild -showBuildSettings -json -project SwiftRadio.xcodeproj \
            -scheme SwiftRadio -configuration Release > "$RUNNER_TEMP/settings.json"
          python3 - "$RUNNER_TEMP/settings.json" >> "$GITHUB_ENV" <<'PY'
          import json, os, sys
          settings = next(item['buildSettings'] for item in json.load(open(sys.argv[1])) if item['target'] == 'SwiftRadio')
          version, build = settings['MARKETING_VERSION'], settings['CURRENT_PROJECT_VERSION']
          if os.environ['VERSION_SOURCE'] == 'next-tag':
              # Exercise a tag version different from the checked-in project without creating a tag.
              major, minor, patch = map(int, version.split('.'))
              patch += 1
              version = f'{major}.{minor}.{patch}'
              build = str(major * 10000 + minor * 100 + patch)
          print('VERSION_NAME=' + version)
          print('BUILD_NUMBER=' + build)
          PY
      - name: Build unsigned Release archive
        run: |
          set -o pipefail
          mkdir -p artifacts
          bash .github/scripts/archive-unsigned-app.sh \
            "$RUNNER_TEMP/SwiftRadio.xcarchive" "$VERSION_NAME" "$BUILD_NUMBER" \
            2>&1 | tee artifacts/archive.log
      - name: Package and validate IPA
        run: |
          python3 .github/scripts/package-unsigned-app.py \
            "$RUNNER_TEMP/SwiftRadio.xcarchive" artifacts/SwiftRadio-unsigned.ipa \
            "$VERSION_NAME" "$BUILD_NUMBER"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unsigned-archive-validation-${{ matrix.version_source }}
          path: artifacts/
          retention-days: 14
