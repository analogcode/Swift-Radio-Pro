name: iOS build

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

permissions:
  contents: read

jobs:
  build:
    name: Build SwiftRadio (Xcode ${{ matrix.xcode }})
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            xcode: '26.6'
          - runner: xcode-27
            xcode: '27.0'
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode }}
      - name: Verify toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Build for testing
        run: |
          xcodebuild build-for-testing \
            -project SwiftRadio.xcodeproj -scheme SwiftRadio \
            -destination 'generic/platform=iOS Simulator' \
            -onlyUsePackageVersionsFromResolvedFile -jobs 2 \
            CODE_SIGNING_ALLOWED=NO
